<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="400" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- 标题 -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">Star History</text>
  
  <!-- 副标题 -->
  <text x="400" y="70" font-family="Arial" font-size="16" text-anchor="middle" fill="#666666">Wayhhow/survey-map</text>
  
  <!-- 坐标轴 -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#cccccc" stroke-width="2"/>
  <line x1="100" y1="50" x2="100" y2="350" stroke="#cccccc" stroke-width="2"/>
  
  <!-- X轴刻度 -->
  <line x1="100" y1="350" x2="100" y2="360" stroke="#333333" stroke-width="2"/>
  <line x1="400" y1="350" x2="400" y2="360" stroke="#333333" stroke-width="2"/>
  <line x1="700" y1="350" x2="700" y2="360" stroke="#333333" stroke-width="2"/>
  
  <!-- Y轴刻度 -->
 <line x1="90" y1="350" x2="100" y2="350" stroke="#333333" stroke-width="2"/> <line x1="90" y1="250" x2="100" y2="250" stroke="#333333" stroke-width="2"/> <line x1="90" y1="150" x2="100" y2="150" stroke="#333333" stroke-width="2"/> <line x1="90" y1="50" x2="100" y2="50" stroke="#333333" stroke-width="2"/>
  
  <!-- 刻度标签 -->
  <text x="100" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">04/10</text> <text x="400" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">04/20</text> <text x="700" y="380" font-family="Arial" font-size="12" text-anchor="middle" fill="#666666">04/30</text>
  
  <!-- Y轴标签 -->
   <text x="70" y="355" font-family="Arial" font-size="12" text-anchor="end" fill="#666666">0</text> <text x="70" y="255" font-family="Arial" font-size="12" text-anchor="end" fill="#666666">1</text> <text x="70" y="155" font-family="Arial" font-size="12" text-anchor="end" fill="#666666">2</text> <text x="70" y="55" font-family="Arial" font-size="12" text-anchor="end" fill="#666666">3</text>
  
  <!-- 数据曲线 -->
  <path d="M100,350 L140,250 L180,250 L220,150 L260,150 L300,150 L340,150 L380,150 L420,150 L460,150 L500,150 L540,150 L580,150 L620,150 L660,150 L700,150" stroke="#4CAF50" stroke-width="3" fill="none"/>
  
  <!-- 数据点 -->
   <circle cx="100" cy="350" r="5" fill="#4CAF50"/> <circle cx="140" cy="250" r="5" fill="#4CAF50"/> <circle cx="180" cy="250" r="5" fill="#4CAF50"/> <circle cx="220" cy="150" r="5" fill="#4CAF50"/> <circle cx="260" cy="150" r="5" fill="#4CAF50"/> <circle cx="300" cy="150" r="5" fill="#4CAF50"/> <circle cx="340" cy="150" r="5" fill="#4CAF50"/> <circle cx="380" cy="150" r="5" fill="#4CAF50"/> <circle cx="420" cy="150" r="5" fill="#4CAF50"/> <circle cx="460" cy="150" r="5" fill="#4CAF50"/> <circle cx="500" cy="150" r="5" fill="#4CAF50"/> <circle cx="540" cy="150" r="5" fill="#4CAF50"/> <circle cx="580" cy="150" r="5" fill="#4CAF50"/> <circle cx="620" cy="150" r="5" fill="#4CAF50"/> <circle cx="660" cy="150" r="5" fill="#4CAF50"/> <circle cx="700" cy="150" r="5" fill="#4CAF50"/>
  
  <!-- 图例 -->
  <rect x="600" y="80" width="15" height="10" fill="#4CAF50"/>
  <text x="620" y="90" font-family="Arial" font-size="12" fill="#333333">Wayhhow/survey-map</text>
  
  <!-- 说明文字 -->
  <text x="400" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#666666">当前星标数: 2</text>
  <text x="400" y="340" font-family="Arial" font-size="12" text-anchor="middle" fill="#999999">图表将通过 GitHub Actions 每 6 小时自动更新</text>
</svg>
