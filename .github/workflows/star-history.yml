name: Star History

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时更新一次
  workflow_dispatch:          # 允许手动点击触发

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的仓库代码
      - uses: actions/checkout@v4

      # 2. 生成 star history 图片
      - uses: star-history/star-history-action@v1.0.0
        with:
          REPOS: "Wayhhow/survey-map"
          BRANCH: "main"
          FILENAME: "star-history"
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. 如果图片有变化，自动提交到仓库
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add star-history.svg
          git diff --cached --quiet || git commit -m "chore: update star history chart"
          git push