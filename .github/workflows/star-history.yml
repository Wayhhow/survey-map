name: Star History

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时更新一次
  workflow_dispatch:          # 允许手动点击触发

permissions:
  contents: write

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取你的仓库代码
      - uses: actions/checkout@v4

      # 2. 生成 star history 图片
      - name: Generate star history chart
        uses: fbuireu/github-star-tracker@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          only-repos: "Wayhhow/survey-map"
          include-charts: true
          data-branch: "star-tracker-data"

      # 3. 复制生成的图表到根目录
      - name: Copy chart to root
        run: |
          git fetch origin star-tracker-data
          git checkout origin/star-tracker-data -- star-history.svg
          git checkout main

      # 4. 如果图片有变化，自动提交到仓库
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add star-history.svg
          git diff --cached --quiet || git commit -m "chore: update star history chart"
          git push